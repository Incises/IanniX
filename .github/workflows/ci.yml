name: CI

on:
  push:
    branches: [ testing, main ]
  pull_request:
    branches: [ testing, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install cmake ninja pkg-config qt@5 muparser rtmidi

      - name: Build and install KF5SyntaxHighlighting
        run: |
          QT_PREFIX="$(brew --prefix qt@5)"
          DEPS_PREFIX="$RUNNER_TEMP/deps"
          echo "CMAKE_PREFIX_PATH=${QT_PREFIX}:${DEPS_PREFIX}" >> "$GITHUB_ENV"
          echo "${QT_PREFIX}/bin" >> "$GITHUB_PATH"

          git clone --depth 1 --branch v5.115.0 https://github.com/KDE/extra-cmake-modules.git "$RUNNER_TEMP/ecm"
          cmake -S "$RUNNER_TEMP/ecm" -B "$RUNNER_TEMP/ecm/build" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DBUILD_TESTING=OFF \
            -DBUILD_HTML_DOCS=OFF \
            -DBUILD_MAN_DOCS=OFF \
            -DBUILD_QTHELP_DOCS=OFF
          cmake --build "$RUNNER_TEMP/ecm/build"
          cmake --install "$RUNNER_TEMP/ecm/build"

          git clone --depth 1 --branch v5.115.0 https://github.com/KDE/syntax-highlighting.git "$RUNNER_TEMP/ksyntax"
          cmake -S "$RUNNER_TEMP/ksyntax" -B "$RUNNER_TEMP/ksyntax/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX};${DEPS_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DBUILD_TESTING=OFF \
            -DBUILD_QCH=OFF
          cmake --build "$RUNNER_TEMP/ksyntax/build"
          cmake --install "$RUNNER_TEMP/ksyntax/build"

          KF5_CMAKE_DIR="$(dirname "$(find "$DEPS_PREFIX" -name "KF5SyntaxHighlightingConfig.cmake" | head -n 1)")"
          echo "KF5SyntaxHighlighting_DIR=${KF5_CMAKE_DIR}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Verify staged install and archive package
        run: |
          ./deploy/shared/stage.sh build dist/stage
          ./deploy/macos/archive/package.sh

      - name: Verify architecture, bundle Qt, and ad-hoc sign
        run: |
          file dist/stage/IanniX.app/Contents/MacOS/IanniX
          file dist/stage/IanniX.app/Contents/Frameworks/Syphon.framework/Versions/A/Syphon
          macdeployqt dist/stage/IanniX.app -libpath="$RUNNER_TEMP/deps/lib"
          codesign --force --deep --entitlements deploy/macos/entitlements.plist -s - dist/stage/IanniX.app
          codesign --verify --deep --strict dist/stage/IanniX.app

  ubuntu:
    name: Ubuntu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            file \
            qtbase5-dev \
            libqt5opengl5-dev \
            qtdeclarative5-dev \
            libqt5serialport5-dev \
            libqt5websockets5-dev \
            qttools5-dev \
            libkf5syntaxhighlighting-dev \
            libmuparser-dev \
            librtmidi-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Verify staged install and DEB package
        run: |
          ./deploy/shared/stage.sh build dist/stage
          ./deploy/linux/deb/package.sh

  opensuse:
    name: openSUSE Tumbleweed
    runs-on: ubuntu-24.04
    container:
      image: opensuse/tumbleweed:latest

    steps:
      - name: Install dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install \
            git \
            cmake \
            ninja \
            gcc-c++ \
            pkg-config \
            rpm-build \
            libqt5-qtbase-devel \
            libqt5-qtdeclarative-devel \
            libqt5-qtserialport-devel \
            libqt5-qtwebsockets-devel \
            libqt5-qttools-devel \
            syntax-highlighting-devel \
            muparser-devel \
            rtmidi-devel

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Verify staged install and RPM package
        run: |
          ./deploy/shared/stage.sh build dist/stage
          ./deploy/linux/rpm/package.sh

  fedora:
    name: Fedora (latest)
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            cmake \
            ninja-build \
            gcc-c++ \
            pkgconf-pkg-config \
            rpm-build \
            mesa-libGL-devel \
            qt5-qtbase-devel \
            qt5-qtdeclarative-devel \
            qt5-qtserialport-devel \
            qt5-qtwebsockets-devel \
            qt5-linguist \
            kf5-syntax-highlighting-devel \
            muParser-devel \
            rtmidi-devel

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Verify staged install and RPM package
        run: |
          ./deploy/shared/stage.sh build dist/stage
          ./deploy/linux/rpm/package.sh

  debian:
    name: Debian (Bookworm)
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            file \
            qtbase5-dev \
            libqt5opengl5-dev \
            qtdeclarative5-dev \
            libqt5serialport5-dev \
            libqt5websockets5-dev \
            qttools5-dev \
            libkf5syntaxhighlighting-dev \
            libmuparser-dev \
            librtmidi-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Verify staged install and DEB package
        run: |
          ./deploy/shared/stage.sh build dist/stage
          ./deploy/linux/deb/package.sh
